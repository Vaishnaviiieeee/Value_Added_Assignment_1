<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilli Travel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar section -->
<div class="navbar">

    <!-- Logo and website name -->
    <div class="logo">
        <img src="Assets/04.png" alt="logo">
        <span>Skilli Travel</span>
    </div>

    <!-- Navigation links -->
    <div class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Destinations</a>
        <a href="#">Packages</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <!-- Book Now button -->
    <a href="#" class="btn-primary">Book Now</a>
</div>

<!-- Hero section -->
<div class="hero" style="background-image: linear-gradient(90deg, rgba(18, 22, 41, 0.72), rgba(18, 22, 41, 0.15)), url('Assets/07.png');">

    <div class="hero-content">

        <h1>Explore the World<br>with Skilli Travel</h1>

        <p>Discover amazing destinations, curated travel<br>packages, and unforgettable experiences.</p>

        <!-- Hero buttons -->
        <div class="hero-buttons">
            <a href="#" class="btn-primary">Explore Packages &rarr;</a>
            <a href="#" class="btn-outline">Contact Us</a>
        </div>

    </div>
</div>
<!-- Search section -->
<div class="search-wrapper">

    <div class="search-bar">

        <!-- Destination option -->
        <div class="search-item">
            <img src="Assets/03.png" alt="Destination">
            <div>
                <div class="search-title">Destination</div>
                <div class="search-sub">Where to go?</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Travel date option -->
        <div class="search-item">
            <img src="Assets/02.png" alt="Date">
            <div>
                <div class="search-title">Travel Date</div>
                <div class="search-sub">Select date</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Travelers option -->
        <div class="search-item">
            <img src="Assets/01.png" alt="Travelers">
            <div>
                <div class="search-title">Travelers</div>
                <div class="search-sub">1 Traveler</div>
            </div>
        </div>

        <!-- Search button -->
        <button class="search-btn">
            <img src="Assets/05.png" alt="Search">
            <span>Search</span>
        </button>

    </div>
</div>

</body>
</html>
